name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Extract ZIP & Prepare HTML File
        run: |
          shopt -s nullglob
          for z in *.zip */*.zip; do
            echo "Extracting $z..."
            unzip -o "$z"
          done
          mkdir -p www
          if [ ! -f "www/index.html" ]; then
            HTML_FILE=$(find . -maxdepth 3 -name "*.html" ! -path "./www/*" ! -path "./node_modules/*" ! -path "./android/*" | head -n 1)
            if [ -n "$HTML_FILE" ]; then
              cp "$HTML_FILE" www/index.html
            else
              echo "ERROR: No HTML file found in repository!"
              ls -la
              exit 1
            fi
          fi
          ls -la www/index.html

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 4. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Initialize Capacitor Android Project
        run: |
          rm -rf node_modules package-lock.json android
          cat << 'EOF' > package.json
          {
            "name": "bara-alsalfa-yemeni",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/android": "6.1.2",
              "@capacitor/cli": "6.1.2",
              "@capacitor/core": "6.1.2"
            }
          }
          EOF
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.yaser.barasalfa",
            "appName": "برا السالفة اليمنية",
            "webDir": "www",
            "backgroundColor": "#0a0a0a"
          }
          EOF
          npm install
          npx cap add android
          npx cap sync android

      - name: 6. Apply App Icons
        run: |
          if [ -d "android-res" ]; then
            cp -r android-res/* android/app/src/main/res/
          else
            ICON_SRC=$(find . -maxdepth 3 \( -name "*.webp" -o -name "*.png" -o -name "*.jpg" \) ! -path "./android/*" ! -path "./node_modules/*" | head -n 1)
            if [ -n "$ICON_SRC" ]; then
              sudo apt-get update && sudo apt-get install -y imagemagick webp
              for dir in android/app/src/main/res/mipmap-*dpi; do
                convert "$ICON_SRC" -resize 192x192 "$dir/ic_launcher.png"
                convert "$ICON_SRC" -resize 192x192 "$dir/ic_launcher_round.png"
                convert "$ICON_SRC" -resize 324x324 -gravity center -background white -extent 432x432 "$dir/ic_launcher_foreground.png"
              done
            fi
          fi

      - name: 7. Build & Sign APK
        run: |
          keytool -genkey -v -keystore release.keystore -alias yaser_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Yaser Al-Eizari, OU=Gaming, O=Yaser, L=Sanaa, S=Sanaa, C=YE"
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon
          cd ..
          
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "output-apk/برا-السالفة-اليمنية-debug.apk"
          
          UNSIGNED_APK=$(find android/app/build/outputs/apk/release -name "*-unsigned.apk" | head -n 1)
          if [ -n "$UNSIGNED_APK" ]; then
            ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -V | tail -n 1)
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
            "$ZIPALIGN" -v -p 4 "$UNSIGNED_APK" aligned.apk
            "$APKSIGNER" sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --out "output-apk/برا-السالفة-اليمنية.apk" aligned.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "output-apk/برا-السالفة-اليمنية.apk"
          fi
          ls -la output-apk/

      - name: 8. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bara-AlSalfa-Yemeni-APK
          path: output-apk/*.apk
