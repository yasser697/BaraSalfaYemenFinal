name: Build برا السالفة اليمنية APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/برا_السالفة_اليمنية_مشروع_جاهز.zip"
          test -f "$ZIP_FILE"
          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -oq "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"
          test -f "$GITHUB_WORKSPACE/project/settings.gradle"
          test -f "$GITHUB_WORKSPACE/project/app/build.gradle"

      - name: Build debug APK
        run: |
          cd "$GITHUB_WORKSPACE/project"
          gradle assembleDebug --no-daemon

      - name: Verify APK
        run: test -f "$GITHUB_WORKSPACE/project/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaraSalfa-debug-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
