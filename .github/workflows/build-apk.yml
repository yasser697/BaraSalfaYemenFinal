name: Build Bara Salfa Yemen APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download repository files
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK components
    run: |
      sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

  - name: Find and extract project ZIP
    run: |
      mkdir -p android-project
      ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No project ZIP file found in repository root."
        exit 1
      fi
      unzip -q "$ZIP_FILE" -d android-project
      PROJECT_DIR=$(find android-project -name settings.gradle -type f -print -quit | xargs dirname)
      if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
        echo "ERROR: Android project files were not found inside the ZIP."
        exit 1
      fi
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build Android APK
    run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Bara-Salfa-Yemen-APK
      path: android-project/**/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
