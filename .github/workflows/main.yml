name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Extract ZIP (If uploaded as ZIP) & Locate HTML
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            for z in *.zip; do
              unzip -o "$z"
            done
          fi
          mkdir -p www
          if [ ! -f "www/index.html" ]; then
            HTML_FILE=$(find . -maxdepth 2 -name "*.html" ! -path "./www/*" ! -path "./node_modules/*" | head -n 1)
            if [ -n "$HTML_FILE" ]; then
              cp "$HTML_FILE" www/index.html
            else
              echo "Error: HTML file not found!" && exit 1
            fi
          fi

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 4. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 6. Initialize Capacitor & Android Project
        run: |
          echo '{"name":"bara-alsalfa-yemeni","version":"1.0.0","dependencies":{"@capacitor/android":"6.1.2","@capacitor/cli":"6.1.2","@capacitor/core":"6.1.2"}}' > package.json
          echo '{"appId":"com.yaser.barasalfa","appName":"برا السالفة اليمنية","webDir":"www","backgroundColor":"#0a0a0a"}' > capacitor.config.json
          npm install
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: 7. Apply App Icon & Dark Status Bar
        run: |
          if [ -d "android-res" ]; then
            cp -r android-res/* android/app/src/main/res/
          else
            ICON_SRC=$(find . -maxdepth 2 \( -name "*.webp" -o -name "*.png" -o -name "*.jpg" \) ! -path "./android/*" ! -path "./node_modules/*" | head -n 1)
            if [ -n "$ICON_SRC" ]; then
              sudo apt-get update && sudo apt-get install -y imagemagick webp
              for dir in android/app/src/main/res/mipmap-*dpi; do
                convert "$ICON_SRC" -resize 192x192 "$dir/ic_launcher.png"
                convert "$ICON_SRC" -resize 192x192 "$dir/ic_launcher_round.png"
                convert "$ICON_SRC" -resize 324x324 -gravity center -background white -extent 432x432 "$dir/ic_launcher_foreground.png"
              done
            fi
          fi
          sed -i 's/Theme.AppCompat.DayNight.NoActionBar/Theme.AppCompat.NoActionBar/g' android/app/src/main/res/values/styles.xml

      - name: 8. Build & Sign APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease
          cd ..
          
          keytool -genkey -v -keystore release.keystore -alias yaser_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Yaser Al-Eizari, OU=Gaming, O=Yaser, L=Sanaa, S=Sanaa, C=YE"
          
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --out "برا-السالفة-اليمنية.apk" aligned.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "برا-السالفة-اليمنية-debug.apk"

      - name: 9. Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Bara-AlSalfa-Yemeni-APK
          path: |
            برا-السالفة-اليمنية.apk
            برا-السالفة-اليمنية-debug.apk
