name: Build Bara Salfa Yemen APK

'on':
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK
    run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

  - name: Extract Android project
    shell: bash
    run: |
      set -e
      mkdir -p android-project
      ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No project ZIP found in repository root."
        exit 1
      fi
      unzip -q "$ZIP_FILE" -d android-project
      PROJECT_DIR=$(find android-project -type f -name settings.gradle -print -quit | xargs -r dirname)
      if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
        echo "ERROR: Android project structure was not found inside the ZIP."
        exit 1
      fi
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build APK
    run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Bara-Salfa-Yemen-APK
      path: android-project/**/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
